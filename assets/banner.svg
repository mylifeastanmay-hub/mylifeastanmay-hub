<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          width: 900px;
          height: 240px;
          box-sizing: border-box;
          background: linear-gradient(135deg, #070b19 0%, #0d1527 50%, #150d2a 100%);
          border-radius: 16px;
          border: 1px solid rgba(56, 189, 248, 0.25);
          box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .bg-glow {
          position: absolute;
          width: 350px;
          height: 350px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(168, 85, 247, 0.15) 50%, transparent 70%);
          top: -100px;
          left: 50%;
          transform: translateX(-50%);
          border-radius: 50%;
          filter: blur(40px);
          animation: pulse 6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
          0% { transform: translateX(-50%) scale(0.9); opacity: 0.6; }
          100% { transform: translateX(-50%) scale(1.15); opacity: 1; }
        }

        .grid-pattern {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 28px 28px;
          opacity: 0.8;
        }

        .content {
          position: relative;
          z-index: 10;
          text-align: center;
        }

        .status-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 5px 14px;
          background: rgba(15, 23, 42, 0.8);
          border: 1px solid rgba(56, 189, 248, 0.35);
          border-radius: 9999px;
          font-size: 11px;
          font-weight: 600;
          color: #38bdf8;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin-bottom: 12px;
          box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .status-dot {
          width: 7px;
          height: 7px;
          background: #22c55e;
          border-radius: 50%;
          box-shadow: 0 0 8px #22c55e;
        }

        .title {
          font-size: 38px;
          font-weight: 800;
          letter-spacing: -0.02em;
          margin: 0;
          background: linear-gradient(90deg, #ffffff 0%, #e0f2fe 30%, #38bdf8 65%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .subtitle {
          font-size: 14px;
          font-weight: 500;
          color: #94a3b8;
          margin: 8px 0 16px 0;
          letter-spacing: 0.02em;
        }

        .badge-row {
          display: flex;
          gap: 10px;
          justify-content: center;
          align-items: center;
        }

        .tech-badge {
          padding: 4px 12px;
          background: rgba(30, 41, 59, 0.6);
          border: 1px solid rgba(148, 163, 184, 0.2);
          border-radius: 6px;
          font-size: 11px;
          font-weight: 600;
          color: #cbd5e1;
        }

        .highlight-cyan { border-color: rgba(56, 189, 248, 0.4); color: #7dd3fc; }
        .highlight-purple { border-color: rgba(192, 132, 252, 0.4); color: #d8b4fe; }
        .highlight-green { border-color: rgba(74, 222, 128, 0.4); color: #86efac; }
        .highlight-orange { border-color: rgba(251, 146, 60, 0.4); color: #fdba74; }
      </style>

      <div class="banner-container">
        <div class="bg-glow"></div>
        <div class="grid-pattern"></div>
        
        <div class="content">
          <div class="status-pill">
            <span class="status-dot"></span>
            <span>AVAILABLE FOR SDE / AI-ML ROLES · 2026</span>
          </div>

          <h1 class="title">TANMAY ATUL DHOOT</h1>
          <p class="subtitle">AI/ML Architect · Distributed Systems Engineer · Interactive 3D Web</p>

          <div class="badge-row">
            <span class="tech-badge highlight-cyan">🛡️ On-Device AI (ExecuTorch INT8)</span>
            <span class="tech-badge highlight-purple">⚡ High-Concurrency FastAPI</span>
            <span class="tech-badge highlight-green">🕸️ P2P Decentralized Compute</span>
            <span class="tech-badge highlight-orange">🌐 Interactive Three.js WebGL</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>